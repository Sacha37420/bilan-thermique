version: "3.9"

networks:
  sso-net:
    external: true
    name: sso-lab_sso-net
  dev-net:
    external: true
    name: dev-net
  bilan-thermique-net:
    driver: bridge
  # Chantier bt-potentiels (lot 38) : réseau INTERNE du service de rendu (Chromium) — il ne voit ni Redis, ni les
  # bases, ni Internet ; seuls le backend et le worker le joignent.
  bilan-thermique-rendu-net:
    driver: bridge
    internal: true

volumes:
  # Lot AL — cache des façades (photos Panoramax, modèles de détection,
  # textures composées) PARTAGÉ entre worker (qui compose) et backend (qui
  # sert les textures) : chacun avait son propre /tmp, et les textures
  # composées par le worker n'étaient jamais visibles du backend. Local et
  # non-external à dessein (cache recalculable, même raisonnement que le
  # scratch d'atelier-3d) : vidé par clean2.sh, les textures se recomposent
  # (« Recomposer les textures »), les baies restent en base.
  facade-cache:
  # Exports de rendu (HTML, Word, PDF) : fichiers transitoires (24 h), non-external à dessein — même raisonnement que
  # le cache des façades ; perdus sans dommage, régénérables.
  rendu-exports:

services:

  backend:
    build: ./backend
    container_name: bilan-thermique-backend
    restart: unless-stopped
    env_file: .env
    ports:
      - "${LAB_BIND_ADDR:-127.0.0.1}:8099:8000"
    volumes:
      - facade-cache:/tmp/bilan-thermique-facades
      - rendu-exports:/data/rendu-exports
    networks:
      - sso-net
      - dev-net
      - bilan-thermique-net
      - bilan-thermique-rendu-net
    labels:
      caddy: "${DOMAIN}"
      caddy.handle_path: "/bilan-thermique-api/*"
      caddy.handle_path.reverse_proxy: "{{upstreams 8000}}"

  redis:
    image: redis:7-alpine
    container_name: bilan-thermique-redis
    restart: unless-stopped
    networks:
      - bilan-thermique-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Service nommé `<app>-worker` (règle du lab, Lot 5 de la refonte). Ancien nom : `worker` —
  # même conteneur ; les deux chemins de déploiement passent `--remove-orphans`, qui retire
  # l'ancien service avant de créer celui-ci (vérifié sur un projet compose factice, 2026-11-14).
  bilan-thermique-worker:
    build: ./backend
    container_name: bilan-thermique-worker
    restart: unless-stopped
    env_file: .env
    # Précalcul d'ombrage (lancers de rayons) et résolution FEM bâtiment sont
    # les deux seuls jobs lourds de cette app — un seul à la fois (verrou DB
    # applicatif dans les vues de lancement), même principe qu'atelier-3d/
    # Refonte (Lot 11) : écoute aussi la file `parc` (traitement de parc), consultée APRÈS la file
    # interactive `celery` (CELERY_BROKER_TRANSPORT_OPTIONS, décision D13) — pas de second worker.
    # lab-admin pour la même raison (2 vCPU/16 Go partagés par tout le lab).
    command: celery -A config worker --loglevel=info --concurrency=1 -Q celery,parc --prefetch-multiplier=1
    volumes:
      - facade-cache:/tmp/bilan-thermique-facades
      - rendu-exports:/data/rendu-exports
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - dev-net
      - bilan-thermique-net
      - bilan-thermique-rendu-net

  # Chantier bt-potentiels (lot 38) : service de rendu — Chromium (Playwright) qui imprime le HTML exporté en PDF et
  # dessine figures et vues 3D en images pour le Word. Jamais dans l'image Django (règle du lab, comme l'engine de
  # robot-lab). Aucun port, aucun label Caddy, aucune sortie réseau (réseau interne + interception dans le service).
  rendu:
    build: ./rendu-service
    image: bilan-thermique-rendu
    container_name: bilan-thermique-rendu
    restart: unless-stopped
    environment:
      RENDU_SERVICE_KEY: ${RENDU_SERVICE_KEY}
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=256m
      - /home/pwuser:size=64m,uid=1000,gid=1000
    cap_drop:
      - ALL
    mem_limit: 1g
    pids_limit: 256
    networks:
      - bilan-thermique-rendu-net
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/sante').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build: ./frontend
    container_name: bilan-thermique-frontend
    restart: unless-stopped
    # Uniquement les variables que lit nginx-entrypoint.sh pour écrire env.js —
    # aucune n'est secrète (env.js est servi au navigateur). `env_file: .env`
    # donnait à ce conteneur nginx tous les secrets de l'app.
    environment:
      DOMAIN: ${DOMAIN:-}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-}
      KEYCLOAK_PUBLIC_URL: ${KEYCLOAK_PUBLIC_URL:-}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-}
      PORT_BACKEND: ${PORT_BACKEND:-}
      PORT_FRONTEND: ${PORT_FRONTEND:-}
    ports:
      - "${LAB_BIND_ADDR:-127.0.0.1}:4214:80"
    networks:
      - sso-net
    labels:
      caddy: "${DOMAIN}"
      caddy.handle_path: "/bilan-thermique/*"
      caddy.handle_path.reverse_proxy: "{{upstreams 80}}"
